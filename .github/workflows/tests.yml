name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Run end-to-end demo smoke test
        # Beviser at demo-stien (python main.py --demo) rent faktisk kører
        # igennem fra en frisk checkout, uden at asserte på det printede
        # output - formålet er blot at bevise at det ikke crasher.
        run: python main.py --demo
